# KKmart whitespace analysis configuration

data_urls:
  # OpenDOSM parquet datasets
  population_district: https://storage.dosm.gov.my/population/population_district.parquet
  hies_district: https://storage.dosm.gov.my/hies/hies_district.parquet
  hh_income_district: https://storage.dosm.gov.my/hies/hh_income_district.parquet
  # DOSM data-open GitHub repo
  census_district: https://raw.githubusercontent.com/dosm-malaysia/data-open/main/datasets/census/census_district.csv
  district_geojson: https://raw.githubusercontent.com/dosm-malaysia/data-open/main/datasets/geodata/administrative_2_district.geojson
  state_geojson: https://raw.githubusercontent.com/dosm-malaysia/data-open/main/datasets/geodata/administrative_1_state.geojson
  state_district_lookup: https://raw.githubusercontent.com/dosm-malaysia/data-open/main/datasets/geodata/state_district.csv

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  output_dir: output
  stores_csv: KKmart_stores   # 'KKmart stores final july' CSV, uploaded at repo root

# Store CSV column names (actual file header -> canonical name)
store_columns:
  name: Store
  address: Address
  longitude: Longitude
  latitude: Latitude

# All store brands for the saturation analysis (path + header of the name column;
# every file has Address/Latitude/Longitude headers, stripped of whitespace on load)
brands:
  KKmart:        {path: KKmart_stores, name_col: Store}
  7-Eleven:      {path: 7eleven_stores, name_col: Store Name}
  99 Speedmart:  {path: 99speedmart_stores, name_col: Store Name}
  FamilyMart:    {path: Familymart_store, name_col: Name}
  myNEWS:        {path: Mynews_stores, name_col: Name}

saturation:
  # district stores_per_100k relative to the national rate
  saturated_ratio: 1.2    # above this = saturated
  open_ratio: 0.5         # below this = underserved / open

# Demand index weights (must sum to 1.0).
# Weighted by data recency: households come from Census 2020 (vintage) so they
# carry less weight; population (2025) and expenditure (HIES 2024) carry more.
demand_weights:
  population: 0.35     # 2025
  households: 0.10     # Census 2020 (vintage - downweighted)
  density: 0.20        # 2025 population / area
  expenditure: 0.20    # HIES 2024
  youth_share: 0.10    # 2025
  growth: 0.05         # 2020-2025 CAGR

scoring:
  population_year: 2025        # latest population vintage to use
  supply_per: 100000           # stores per N population
